# Release notes generation config, consumed by `gh release create --generate-notes`
# in .github/workflows/release.yml.
#
# See https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    # Hide automated dependency bumps from the user-facing changelog.
    # The bumps still land in main and are visible in the commit log
    # for anyone who wants the full picture.
    authors:
      - dependabot
      - dependabot[bot]
    labels:
      - dependencies
      - ignore-for-release
  categories:
    # Order matters — first matching label wins. Anything that doesn't
    # match an earlier category falls through to "Other changes" so
    # nothing important gets dropped silently.
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
