name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (same convention as
      # release.yml). Dependabot maintains both SHA and trailing comment.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      # `-short` skips the typescript-eslint compatibility harness
      # (each rule package gates ~6193 fixtures behind testing.Short).
      # Unit and CLI integration tests still run in full.
      #
      # `-timeout=20m` overrides the default 10-minute per-package
      # cap. The CLI integration suite builds the binary in-process
      # and runs a daemon round-trip per test, so on a hosted runner
      # that lands a hot cache miss the suite can flirt with the
      # default; the override is generous enough to absorb that
      # variance without hiding a genuine deadlock — a real hang
      # would still trip the 20m limit.
      - name: Test
        run: go test -short -timeout=20m ./...
