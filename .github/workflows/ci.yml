name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      # `-short` skips the typescript-eslint compatibility harness
      # (each rule package gates ~6193 fixtures behind testing.Short).
      # Unit and CLI integration tests still run in full.
      - name: Test
        run: go test -short ./...
